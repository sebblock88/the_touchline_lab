<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>theTouchline - Players</title>
    <link rel="stylesheet" th:href="@{/css/output.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<main>
    <div>
        <div>
            <h1>Player Statistics</h1>
            <p>FPL Dashboard Data</p>
        </div>

        <form th:action="@{/players/sync}" method="post">
            <button type="submit">
                Sync Latest Player Data
            </button>
        </form>
    </div>

    <!-- Debug Alert Box if list is empty -->
    <div th:if="${players == null or players.empty}">
        <p>No player data synced</p>
        <p>Click the sync button above to populate database</p>
    </div>

    <form th:action="@{/players}" method="get">
        <label for="minMins">Min Minutes:</label>
        <input type="number" id="minMins" name="minMinutes" th:value="${minMinutes}"><br><br>
        <label for="maxPrice">Max Price:</label>
        <input type="number" step="0.1" id="maxPrice" name="maxPrice" th:value="${maxPrice}"><br><br>
        <label for="minDefCon">Min DefCon per 90mins:</label>
        <input type="number" step="0.1" id="minDefCon" name="minDefCon" th:value="${minDefCon}"><br><br>
        <label for="position">Position:</label>
        <select id="position" name="position">
            <option value="">All positions</option>
            <option value="Goalkeeper" th:selected="${selectedPosition == 'Goalkeeper'}">Goalkeeper</option>
            <option value="Defender" th:selected="${selectedPosition == 'Defender'}">Defender</option>
            <option value="Midfielder" th:selected="${selectedPosition == 'Midfielder'}">Midfielder</option>
            <option value="Forward" th:selected="${selectedPosition == 'Forward'}">Forward</option>
        </select>
        <button type="submit">Search</button>
    </form>

    <table>
        <tr>
            <th>Name</th>
            <th>Position</th>
            <th>Team</th>
            <th>Price</th>
            <th>Points</th>
            <th>Points Per Million</th>
            <th>Minutes</th>
            <th>DefCon per 90mins</th>
        </tr>
        <tr th:each="player: ${players}">
            <td th:text="${player.webName}"></td>
            <td th:text="${player.positionId}"></td>
            <td th:text="${player.team}"></td>
            <td th:text="${player.costInMillions}"></td>
            <td th:text="${player.totalPoints}"></td>
            <td th:text="${player.pointsPerMillion()}"></td>
            <td th:text="${player.minutes}"></td>
            <td th:text="${player.defCon}"></td>
        </tr>

    </table>


</main>

</body>
</html>
